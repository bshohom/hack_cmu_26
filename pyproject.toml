[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "to-agent"
version = "0.1.0"
description = "Agent-facing 3D topology optimization toolkit built on torch-fem"
requires-python = ">=3.10"
dependencies = [
  # Install torch first from the CUDA index (see README).
  "torch>=2.0",
  # torch-fem brings numpy, scipy, meshio, pyvista, matplotlib, pyamg.
  "torch-fem==0.11.0",
  "trimesh>=4.0",
  "rtree",          # spatial index used by trimesh.contains / proximity
  "pydantic>=2",
  "pyyaml",
  "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
registration = [
  # Depth Anything 3 must be installed separately with --no-deps (see README).
  # Its own pyproject pins numpy<2 and pulls moviepy/evo/gsplat extras that
  # fight this env's numpy 2 / pandas 3 stack.
  "evo>=1.37",
  "gradio>=6.17",
  "matplotlib>=3.10",
  "moviepy==1.0.3",
  "omegaconf>=2.3",
  "open3d>=0.19",
  "opencv-python>=4.13",
  "pillow>=12",
  "pillow-heif>=1.7",
  "plyfile>=1.1",
  "pycolmap>=4.2",
  "scikit-learn>=1.8",
  "scipy>=1.17",
  "shapely>=2.1",
  "transformers>=5.5.4",
]

[project.scripts]
to-agent = "to_agent.cli:app"

[tool.setuptools.packages.find]
include = ["to_agent*", "surfcap*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["HackCMU", "Hack_CMU_Agentic_Interface", "out", ".git"]
